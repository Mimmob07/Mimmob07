<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Mimmo Baluyut, Robotics at the University of Michigan">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1220" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0b1220" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="230" rx="14" fill="#0b1220"/>
  <rect width="1000" height="230" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="230" rx="14" fill="url(#fade)"/>
  <!-- planned path with waypoints, a nod to robot motion planning -->
  <path d="M600 190 C 680 190, 690 70, 780 80 S 900 170, 960 50" fill="none" stroke="#ffcb05" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
  <g fill="#0b1220" stroke="#ffcb05" stroke-width="2">
    <circle cx="600" cy="190" r="5"/><circle cx="780" cy="80" r="5"/><circle cx="960" cy="50" r="5"/>
  </g>
  <!-- omniwheel robot footprint -->
  <g transform="translate(700,128) rotate(-35)">
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#132036" stroke="#6ea8fe" stroke-width="2"/>
    <g fill="#6ea8fe"><rect x="-30" y="-8" width="6" height="16" rx="2"/><rect x="24" y="-8" width="6" height="16" rx="2"/><rect x="-8" y="-30" width="16" height="6" rx="2"/><rect x="-8" y="24" width="16" height="6" rx="2"/></g>
    <path d="M0 -10 L8 6 L-8 6 Z" fill="#ffcb05"/>
  </g>
  <text x="48" y="96" fill="#e6edf3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700">Mimmo Baluyut</text>
  <text x="50" y="134" fill="#9fb3c8" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20">Robotics · University of Michigan College of Engineering</text>
  <text x="50" y="178" fill="#ffcb05" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15">C++  ·  Rust  ·  Python  ·  embedded  ·  computer vision</text>
</svg>
